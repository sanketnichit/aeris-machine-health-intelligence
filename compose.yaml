services:
  dashboard:
    build: .
    environment:
      AERIS_API_URL: http://api:8080
      AERIS_ENABLE_REVIEW_ACTIONS: ${AERIS_ENABLE_REVIEW_ACTIONS:-0}
      AERIS_API_TOKEN: ${AERIS_API_TOKEN:-}
    image: aeris-research:local
    ports:
      - "127.0.0.1:8501:8501"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health',timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
  api:
    build: .
    environment:
      AERIS_API_TOKEN: ${AERIS_API_TOKEN:-}
    image: aeris-research:local
    command: ["python", "-m", "src.api", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    volumes:
      - telemetry-data:/opt/aeris/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/evidence',timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5

  monitor:
    image: aeris-research:local
    build: .
    profiles: [monitoring]
    command: ["python", "-m", "src.monitor_worker", "--interval", "30"]
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    volumes:
      - telemetry-data:/opt/aeris/data

volumes:
  telemetry-data:
