services:
  dashboard:
    build: .
    image: aeris-research:local
    ports:
      - "127.0.0.1:8501:8501"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health',timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
  api:
    build: .
    image: aeris-research:local
    command: ["python", "-m", "src.api", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/evidence',timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
