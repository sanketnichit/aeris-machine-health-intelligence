name: AERIS telemetry replay
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-telemetry.yml'
      - 'research/cmapss_telemetry_replay.py'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_cmapss_telemetry_replay.py
      - run: python scripts/download_cmapss.py --output "$RUNNER_TEMP/cmapss"
      - name: Export telemetry evidence
        run: |
          mkdir -p evidence
          python -m research.cmapss_telemetry_replay --data-dir "$RUNNER_TEMP/cmapss" > evidence/telemetry.json
          python -c 'import json; print(json.dumps(json.load(open("evidence/telemetry.json")),separators=(",",":")))'
          git rev-parse HEAD > evidence/commit.txt
          python -m pip freeze > evidence/environment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: telemetry-development-evidence
          path: evidence/
          if-no-files-found: error
