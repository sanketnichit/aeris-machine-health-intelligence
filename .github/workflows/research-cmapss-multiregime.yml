name: AERIS C-MAPSS multi-regime evaluation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/research-cmapss-multiregime.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_cmapss_multiregime.py tests/test_cmapss_official.py
      - run: python -m research.verify_evidence
      - run: python -m scripts.download_cmapss_all --output "$RUNNER_TEMP/cmapss-all"
      - name: Execute frozen evaluation
        run: |
          mkdir -p multiregime-evidence
          python -m research.cmapss_multiregime --data-dir "$RUNNER_TEMP/cmapss-all" --output multiregime-evidence/summary.json
          cp "$RUNNER_TEMP/cmapss-all/manifest.json" multiregime-evidence/dataset.json
          cp research/CMAPSS_MULTIREGIME_PROTOCOL.md multiregime-evidence/protocol.md
          git rev-parse HEAD > multiregime-evidence/revision.txt
          python -m pip freeze > multiregime-evidence/environment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cmapss-multiregime-evidence
          path: multiregime-evidence/
          if-no-files-found: error
