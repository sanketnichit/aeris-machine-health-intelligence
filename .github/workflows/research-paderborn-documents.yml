name: AERIS Paderborn specimen document audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/research-paderborn-documents.yml
      - research/paderborn_documents.py
permissions:
  contents: read
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt rarfile==4.2
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools poppler-utils
      - run: python -m pytest -q tests/test_paderborn_documents.py tests/test_paderborn_cohort.py
      - run: python -m research.verify_evidence
      - name: Extract bounded technical metadata from pinned PDFs
        run: |
          mkdir -p document-evidence
          python -m research.paderborn_documents --directory "$RUNNER_TEMP/paderborn" --output document-evidence/summary.json
          cp research/PADERBORN_DOCUMENTS_PROTOCOL.md document-evidence/protocol.md
          python -m pip freeze > document-evidence/environment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: paderborn-document-evidence
          path: document-evidence/
          if-no-files-found: error
