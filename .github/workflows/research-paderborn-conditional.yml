name: AERIS Paderborn conditional transfer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/research-paderborn-conditional.yml
      - research/paderborn_conditional.py
permissions:
  contents: read
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt rarfile==4.2
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools poppler-utils
      - run: python -m pytest -q tests/test_paderborn_conditional.py tests/test_paderborn_documents.py tests/test_paderborn_preprocessing.py
      - run: python -m research.verify_evidence
      - name: Execute frozen conditional timing transfer
        run: |
          mkdir -p conditional-evidence
          python -m research.paderborn_conditional --directory "$RUNNER_TEMP/paderborn" --output conditional-evidence/summary.json
          cp research/PADERBORN_CONDITIONAL_PROTOCOL.md conditional-evidence/protocol.md
          python -m pip freeze > conditional-evidence/environment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: paderborn-conditional-evidence
          path: conditional-evidence/
          if-no-files-found: error
