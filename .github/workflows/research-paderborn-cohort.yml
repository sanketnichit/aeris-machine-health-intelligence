name: AERIS Paderborn primary cohort inventory
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/research-paderborn-cohort.yml
      - research/paderborn_cohort.py
permissions:
  contents: read
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt rarfile==4.2
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: python -m pytest -q tests/test_paderborn_cohort.py tests/test_paderborn_intake.py
      - run: python -m research.verify_evidence
      - name: Inventory pinned primary cohort archives
        run: |
          mkdir -p cohort-evidence
          python -m research.paderborn_cohort --directory "$RUNNER_TEMP/paderborn" --output cohort-evidence/summary.json
          cp research/PADERBORN_COHORT_PROTOCOL.md cohort-evidence/protocol.md
          python -m pip freeze > cohort-evidence/environment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: paderborn-cohort-evidence
          path: cohort-evidence/
          if-no-files-found: error
