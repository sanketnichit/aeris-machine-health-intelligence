name: AERIS browser smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app.py
      - src/evidence_console.py
      - src/measurement_console.py
      - src/calibration_console.py
      - src/multiregime_console.py
      - src/paderborn_console.py
      - research/evidence/**
      - src/vibration_console.py
      - src/vibration_acquisition.py
      - src/vibration_spectrum.py
      - src/capture_archive.py
      - research/technical_report.py
      - scripts/browser_smoke.py
      - .streamlit/config.toml
      - .github/workflows/browser-smoke.yml
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - name: Start Streamlit and check health
        run: |
          mkdir -p browser-evidence
          python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > browser-evidence/server.log 2>&1 &
          echo $! > /tmp/aeris-streamlit.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then exit 0; fi
            sleep 1
          done
          cat browser-evidence/server.log
          exit 1
      - name: Navigate research pages in browser
        run: python scripts/browser_smoke.py --output browser-evidence
      - name: Stop server
        if: always()
        run: |
          if test -f /tmp/aeris-streamlit.pid; then kill "$(cat /tmp/aeris-streamlit.pid)" || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aeris-browser-evidence
          path: browser-evidence/
          if-no-files-found: warn
