name: AERIS Paderborn timebase audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/research-paderborn-timebase.yml
      - research/paderborn_timebase.py
permissions:
  contents: read
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt rarfile==4.2
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: python -m pytest -q tests/test_recording_timebase.py tests/test_paderborn_intake.py
      - run: python -m research.verify_evidence
      - name: Inspect registered time axes and speed metadata
        run: |
          mkdir -p timebase-evidence
          python -m research.paderborn_timebase --directory "$RUNNER_TEMP/paderborn" --output timebase-evidence/summary.json
          cp research/PADERBORN_TIMEBASE_PROTOCOL.md timebase-evidence/protocol.md
          python -m pip freeze > timebase-evidence/environment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: paderborn-timebase-evidence
          path: timebase-evidence/
          if-no-files-found: error
