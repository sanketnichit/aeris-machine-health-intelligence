name: AERIS CWRU spectral audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/research-cwru-spectral.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_cwru_spectral_audit.py tests/test_vibration_spectrum.py
      - name: Acquire fixed official files
        run: |
          mkdir -p "$RUNNER_TEMP/cwru" cwru-evidence
          for id in 105 106 107 108 130 131 132 133; do
            curl --fail --location --retry 2 --max-time 60 --max-filesize 20000000 "https://engineering.case.edu/sites/default/files/$id.mat" -o "$RUNNER_TEMP/cwru/$id.mat"
          done
      - name: Execute frozen spectral audit
        run: |
          python -m research.cwru_spectral_audit "$RUNNER_TEMP/cwru" --output cwru-evidence/summary.json
          python -m pip freeze > cwru-evidence/environment.txt
          git rev-parse HEAD > cwru-evidence/revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cwru-spectral-evidence
          path: cwru-evidence/
          if-no-files-found: error
