name: AERIS fleet browser
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app.py
      - src/fleet_console.py
      - src/decision_engine.py
      - src/api.py
      - src/telemetry_store.py
      - src/incidents.py
      - compose.yaml
      - Dockerfile
      - scripts/demo_fleet.py
      - scripts/fleet_browser_smoke.py
      - .github/workflows/fleet-browser.yml
permissions:
  contents: read
jobs:
  fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Enable local review actions with ephemeral token
        run: |
          token="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::$token"
          echo "AERIS_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "AERIS_ENABLE_REVIEW_ACTIONS=1" >> "$GITHUB_ENV"
      - run: docker compose up --build --detach --wait --wait-timeout 180
      - run: python scripts/demo_fleet.py
      - run: python scripts/fleet_browser_smoke.py --review
      - name: Collect service logs
        if: always()
        run: |
          mkdir -p fleet-browser-evidence
          docker compose logs --no-color > fleet-browser-evidence/services.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fleet-browser-evidence
          path: fleet-browser-evidence/
      - name: Stop disposable CI stack
        if: always()
        run: docker compose down --volumes
