name: AERIS XJTU physical bearing research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-xjtu.yml'
permissions:
  contents: read
jobs:
  physical-bearing:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt gdown==5.2.0
      - run: python -m pytest -q tests/test_xjtu_bearing_audit.py
      - name: Acquire author-linked archive
        run: |
          timeout 30m python -m gdown '1_ycmG46PARiykt82ShfnFfyQsaXv3_VK' -O "$RUNNER_TEMP/xjtu.zip"
          ls -lh "$RUNNER_TEMP/xjtu.zip"
          python -c 'import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); print("Archive members:",len(z.infolist())); print(z.namelist()[:20])' "$RUNNER_TEMP/xjtu.zip"
      - name: Execute bearing-disjoint physical experiment
        run: |
          mkdir -p evidence
          python -m research.xjtu_bearing_audit --archive "$RUNNER_TEMP/xjtu.zip" > evidence/xjtu_audit.json
          python -c 'import json; d=json.load(open("evidence/xjtu_audit.json")); print(json.dumps({k:v for k,v in d.items() if k!="predictions"},indent=2))'
          cp research/XJTU_PROTOCOL.md evidence/protocol.md
          git rev-parse HEAD > evidence/commit.txt
          python -m pip freeze > evidence/environment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: xjtu-physical-development-evidence
          path: evidence/
          if-no-files-found: error
