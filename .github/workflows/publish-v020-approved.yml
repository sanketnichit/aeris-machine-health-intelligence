name: AERIS publish approved v0.2.0 GitHub release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v020-approved.yml
permissions:
  contents: read
concurrency:
  group: aeris-v020-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ACCEPTED_SHA: 5e6aba8f01f0a35347698c4c45661b09db7a92ca
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5e6aba8f01f0a35347698c4c45661b09db7a92ca
          persist-credentials: false
      - name: Verify unchanged draft and exact accepted artifacts
        shell: bash
        run: |
          set -euo pipefail
          test "$REPO" = sanketnichit/aeris-machine-health-intelligence
          test "$(git rev-parse HEAD)" = "$ACCEPTED_SHA"
          test "$(cat VERSION)" = 0.2.0
          for run in 45621480183 45621480240 45621480466; do
            test "$(gh run view "$run" --repo "$REPO" --json headSha --jq .headSha)" = "$ACCEPTED_SHA"
            test "$(gh run view "$run" --repo "$REPO" --json conclusion --jq .conclusion)" = success
          done
          gh release view v0.2.0 --repo "$REPO" --json isDraft,tagName,targetCommitish,assets > draft.json
          jq -e --arg sha "$ACCEPTED_SHA" '.isDraft == true and .tagName == "v0.2.0" and .targetCommitish == $sha and (.assets|length)==5' draft.json
          gh api "repos/$REPO/actions/artifacts/15025206458/zip" > release-artifact.zip
          echo "9ff2b1f242abf44130c74a805124be647a07061e7bf4a83e785537dbffaab9bd  release-artifact.zip" | sha256sum -c -
          mkdir dist
          unzip -q release-artifact.zip -d dist
          test "$(cat dist/revision.txt)" = "$ACCEPTED_SHA"
          (cd dist && sha256sum -c SHA256SUMS)
          for file in aeris-0.2.0.zip AERIS_technical_report.md SHA256SUMS revision.txt environment.txt; do
            digest="sha256:$(sha256sum "dist/$file" | cut -d ' ' -f 1)"
            jq -e --arg name "$file" --arg digest "$digest" 'any(.assets[]; .name==$name and .digest==$digest and .state=="uploaded")' draft.json
          done
          test -z "$(git ls-remote --tags origin refs/tags/v0.2.0)"
      - name: Publish approved research draft
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/contents/docs/v020_public_release_notes.md?ref=${{ github.sha }}" --jq .content | base64 -d > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          gh release edit v0.2.0 --repo "$REPO" --notes-file "$RUNNER_TEMP/notes.md" --draft=false --latest
          gh release view v0.2.0 --repo "$REPO" --json isDraft,tagName,targetCommitish,url,assets > published.json
          jq -e '.isDraft == false and .tagName == "v0.2.0" and (.assets|length)==5' published.json
          test "$(git ls-remote --tags origin refs/tags/v0.2.0 | cut -f1)" = "$ACCEPTED_SHA"
          cat published.json
      - name: Independently confirm public release via REST API
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/releases/tags/v0.2.0" > verified-publication.json
          jq -e --arg sha "$ACCEPTED_SHA" '.draft == false and .tag_name == "v0.2.0" and .target_commitish == $sha and .published_at != null and (.assets|length)==5' verified-publication.json
          jq '{tag_name,draft,published_at,html_url,target_commitish}' verified-publication.json
