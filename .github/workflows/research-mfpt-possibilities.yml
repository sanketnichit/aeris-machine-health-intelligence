name: AERIS MFPT possible suggestion sets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/research-mfpt-possibilities.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_order_possibilities.py tests/test_order_counterexamples.py tests/test_order_breakpoints.py tests/test_order_uncertainty.py
      - name: Verify registered evidence before data acquisition
        run: python -m research.verify_evidence
      - name: Acquire pinned recordings
        run: |
          mkdir -p "$RUNNER_TEMP/mfpt" mfpt-possibility-evidence
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          from research.mfpt_transfer import FILES, BASE
          for name,kind in FILES:
              path=Path(os.environ["RUNNER_TEMP"])/"mfpt"/name
              path.parent.mkdir(parents=True,exist_ok=True)
              subprocess.run(["curl","--fail","--location","--retry","2","--max-time","60","--max-filesize","20000000",BASE+name,"-o",str(path)],check=True)
          PY
      - name: Execute retrospective outer-set audit
        run: |
          python -m research.mfpt_possibilities "$RUNNER_TEMP/mfpt" --output mfpt-possibility-evidence/summary.json
          python -m pip freeze > mfpt-possibility-evidence/environment.txt
          git rev-parse HEAD > mfpt-possibility-evidence/revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mfpt-possibility-evidence
          path: mfpt-possibility-evidence/
          if-no-files-found: error
